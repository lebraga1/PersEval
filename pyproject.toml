[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perseval"
version = "1.0.0"
description = "A framework for perspectivist classification evaluation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["perseval*"]

[tool.setuptools.package-data]
"perseval.results" = ["schemas/1.0/*.json", "schemas/1.0/SHA256SUMS", "schemas/*.json"]
